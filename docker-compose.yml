services:
  db:
    image: postgres:18
    container_name: hcedp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hcedp
      POSTGRES_PASSWORD: hcedp_local_dev
      POSTGRES_DB: hcedp
    ports:
      - "5432:5432"
    # Postgres 18+ Docker images expect the mount at /var/lib/postgresql (data
    # lives in a version-specific subdir), not /var/lib/postgresql/data.
    volumes:
      - hcedp_pgdata_pg18b:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcedp -d hcedp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hcedp_pgdata_pg18b:
